version: '3'

services:
  face-recognition-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: facex-zoo-gui:latest
    container_name: facex-zoo-gui
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # Share X11 socket for GUI
      - ./Twarze:/app/Twarze:rw        # Share face images directory
      - ./Logs:/app/Logs:rw            # Share logs directory
      - ./config:/app/config:ro        # Share config files (read-only)
    environment:
      - DISPLAY=${DISPLAY}              # Pass DISPLAY variable from host
      - QT_X11_NO_MITSHM=1             # Fix for some X11 rendering issues
    devices:
      - /dev/video0:/dev/video0        # Share primary webcam
      # Uncomment if you have multiple webcams
      # - /dev/video1:/dev/video1      # Share additional webcam
    network_mode: host                  # Use host network for easier X11 access
    # For better security (if X11 forwarding works with the default network):
    # network_mode: bridge
    # ports:
    #   - "6000:6000"  # For X11 forwarding if needed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import cv2; cv2.VideoCapture(0).isOpened()"]
      interval: 30s
      timeout: 10s
      retries: 3
